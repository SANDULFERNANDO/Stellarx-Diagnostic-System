<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StellarX - Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="api.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            stellarNavy: '#114a72',
            stellarDark: '#0f2d4a'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f4f7f9] min-h-screen flex items-center justify-center p-4 antialiased font-sans">

  <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-8 space-y-6">
    <!-- Header -->
    <div class="text-center">
      <div class="flex items-center justify-center space-x-2 mb-4">
        <i data-lucide="layers" class="w-8 h-8 text-[#114a72]"></i>
        <span class="text-2xl font-black tracking-wide text-[#114a72]">StellarX</span>
      </div>
      <h1 class="text-2xl font-black text-slate-800">Reset Password</h1>
      <p class="text-sm text-slate-500 mt-1">Enter your email address and we'll send you a reset link.</p>
    </div>

    <!-- Success/Error Messages -->
    <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm">
      ✅ Password reset link sent to your email. Please check your inbox.
    </div>
    <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
      ❌ Something went wrong. Please try again.
    </div>

    <!-- Form -->
    <form id="forgotPasswordForm" class="space-y-4" onsubmit="handleForgotPassword(event)">
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
          <input
            type="email"
            id="resetEmail"
            required
            placeholder="name@hospital.com"
            class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-sky-500 transition-colors"
          />
        </div>
      </div>

      <button
        type="submit"
        id="submitBtn"
        class="w-full py-3.5 bg-[#114a72] hover:bg-[#0c3d5e] text-white text-sm font-bold rounded-xl transition-colors shadow-md active:scale-[0.99]"
      >
        Send Reset Link
      </button>
    </form>

    <!-- Back to Login -->
    <div class="text-center text-xs text-slate-500 font-medium">
      Remember your password?
      <a href="login.html" class="text-[#114a72] font-bold hover:underline cursor-pointer">
        Back to Login
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    async function handleForgotPassword(e) {
      e.preventDefault();

      const email = document.getElementById('resetEmail').value.trim().toLowerCase();
      const submitBtn = document.getElementById('submitBtn');
      const successMsg = document.getElementById('successMessage');
      const errorMsg = document.getElementById('errorMessage');

      // Hide previous messages
      successMsg.classList.add('hidden');
      errorMsg.classList.add('hidden');

      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        // ✅ FIXED: Send email as query parameter
        const response = await apiRequest(`/auth/forgot-password?email=${encodeURIComponent(email)}`, 'POST');

        // Show success message
        successMsg.classList.remove('hidden');
        successMsg.textContent = '✅ ' + (response.message || 'Password reset link sent!');

        // Reset form
        document.getElementById('resetEmail').value = '';

      } catch (error) {
        errorMsg.classList.remove('hidden');
        let errorText = 'Something went wrong. Please try again.';
        if (error && error.message) {
          errorText = error.message;
        }
        errorMsg.textContent = '❌ ' + errorText;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    }
  </script>
</body>
</html>
