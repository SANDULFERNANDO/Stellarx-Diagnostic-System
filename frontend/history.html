<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StellarX - Case History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="api.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            stellarNavy: '#114a72',
            stellarDark: '#0f2d4a',
            bgGray: '#f4f7f9'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f4f7f9] min-h-screen text-slate-800 font-sans antialiased relative pb-12">

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <nav class="bg-[#114a72] text-white px-6 md:px-16 py-4 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2 cursor-pointer" onclick="window.location.href='dashboard.html'">
      <i data-lucide="layers" class="w-6 h-6 text-white"></i>
      <span class="text-xl font-black tracking-tight">StellarX</span>
    </div>

    <div class="flex items-center space-x-6">
      <a href="profile.html" class="w-8 h-8 bg-slate-200/20 hover:bg-slate-200/30 rounded-full flex items-center justify-center text-white transition-colors">
        <i data-lucide="user" class="w-4 h-4"></i>
      </a>
    </div>
  </nav>

  <!-- ================= MAIN WORKSPACE CONTENT ================= -->
  <main class="max-w-5xl mx-auto px-6 mt-10 space-y-6">
    
    <!-- Header Row -->
    <div class="flex items-center justify-between">
      <div class="space-y-1">
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">Case History</h1>
        <p class="text-sm text-slate-500 font-medium">Review all previously analyzed diagnostic records and AI predictions.</p>
      </div>
      <button onclick="window.location.href='dashboard.html'" class="px-4 py-2 bg-white border border-slate-200 hover:border-slate-300 rounded-xl text-xs font-bold text-slate-700 shadow-sm transition-colors flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Dashboard
      </button>
    </div>

    <hr class="border-slate-200/80">

    <!-- ================= FILTER SECTION (NEW) ================= -->
    <div class="bg-white rounded-xl border border-slate-200/60 shadow-sm p-4 space-y-3">
      <div class="flex items-center gap-2">
        <i data-lucide="filter" class="w-4 h-4 text-[#114a72]"></i>
        <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">Filter Cases</span>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <!-- Search by Case ID -->
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Case ID</label>
          <input
            type="text"
            id="filterCaseId"
            placeholder="Search by Case ID..."
            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-[#114a72] transition-colors"
          />
        </div>
        
        <!-- Filter by Status -->
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Status</label>
          <select
            id="filterStatus"
            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-[#114a72] transition-colors bg-white"
          >
            <option value="">All Statuses</option>
            <option value="DRAFT">Draft</option>
            <option value="READY_FOR_ANALYSIS">Ready for Analysis</option>
            <option value="COMPLETED">Completed</option>
            <option value="REVIEWED">Reviewed</option>
          </select>
        </div>
        
        <!-- Start Date -->
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">From Date</label>
          <input
            type="date"
            id="filterStartDate"
            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-[#114a72] transition-colors"
          />
        </div>
        
        <!-- End Date -->
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">To Date</label>
          <input
            type="date"
            id="filterEndDate"
            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-[#114a72] transition-colors"
          />
        </div>
      </div>
      
      <!-- Filter Actions -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <button
          onclick="applyFilters()"
          class="px-4 py-2 bg-[#114a72] hover:bg-[#0c3d5e] text-white text-xs font-bold rounded-lg transition-colors shadow-sm"
        >
          Apply Filters
        </button>
        <button
          onclick="clearFilters()"
          class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-colors"
        >
          Clear
        </button>
      </div>
    </div>

    <!-- Full Case History Grid Wrapper -->
    <div class="bg-white rounded-xl border border-slate-200/60 shadow-sm p-6 space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h2 class="text-base font-black text-slate-900 tracking-tight flex items-center gap-2">
          <i data-lucide="folder-heart" class="w-4 h-4 text-[#114a72]"></i> All Diagnostic Logs
        </h2>
        <span id="historyTotalCount" class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">Total: 0 Cases</span>
      </div>

      <!-- Dynamic History Items List Container -->
      <div id="fullHistoryContainer" class="space-y-3 pt-2">
        <p class="text-xs font-medium text-slate-400 py-8 text-center" id="noHistoryText">
          No diagnostic cases recorded in the system history yet.
        </p>
      </div>
    </div>
  </main>

  <!-- ================= CORE JAVASCRIPT ================= -->
  <script>
    window.onload = function() {
      lucide.createIcons();
      loadAllCaseHistory();
    }

    // ✅ Updated: Pass caseId to result page
    function viewCaseDetails(caseId) {
      localStorage.setItem('current_case_id', caseId);
      window.location.href = 'result.html';
    }

    // =====================================================
    // FILTER FUNCTIONS (FR-48)
    // =====================================================

    function applyFilters() {
      const filters = {
        case_id: document.getElementById('filterCaseId').value.trim() || undefined,
        status: document.getElementById('filterStatus').value || undefined,
        start_date: document.getElementById('filterStartDate').value || undefined,
        end_date: document.getElementById('filterEndDate').value || undefined
      };
      
      // Remove undefined values
      Object.keys(filters).forEach(key => {
        if (filters[key] === undefined) delete filters[key];
      });
      
      // Show loading state
      document.getElementById('fullHistoryContainer').innerHTML = `
        <div class="text-center py-8">
          <div class="animate-pulse text-slate-400">Loading...</div>
        </div>
      `;
      
      loadAllCaseHistory(filters);
    }

    function clearFilters() {
      document.getElementById('filterCaseId').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterStartDate').value = '';
      document.getElementById('filterEndDate').value = '';
      loadAllCaseHistory({});
    }

    // =====================================================
    // LOAD CASE HISTORY (UPDATED WITH FILTERS)
    // =====================================================

    async function loadAllCaseHistory(filters = {}) {
      const container = document.getElementById('fullHistoryContainer');
      const countBadge = document.getElementById('historyTotalCount');
      
      if (!isAuthenticated()) {
        container.innerHTML = `<p class="text-xs font-medium text-slate-400 py-8 text-center">Please login to view cases.</p>`;
        countBadge.innerText = 'Not authenticated';
        return;
      }
      
      try {
        // ✅ Pass filters to API
        const cases = await apiListCases(filters);
        countBadge.innerText = `Total: ${cases.length} Cases`;
        
        if (cases.length === 0) {
          container.innerHTML = `
            <div class="text-center py-8">
              <p class="text-xs font-medium text-slate-400">No cases found.</p>
              <p class="text-xs text-slate-300 mt-1">Try adjusting your filters.</p>
            </div>
          `;
          return;
        }
        
        let dynamicHtml = "";
        
        // Process each case
        for (const item of cases) {
          const prediction = item.diagnosis_result || 'Pending';
          const status = item.status || 'DRAFT';
          const badgeColor = status === 'COMPLETED' ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 
                             status === 'DRAFT' ? 'bg-amber-50 text-amber-700 border-amber-100' :
                             'bg-slate-50 text-slate-600 border-slate-200';
          const confidenceText = status === 'COMPLETED' ? 'Completed' : 'In Progress';
          
          // Fetch image count for this case
          let imageCount = 0;
          try {
            const imagesResponse = await apiGetCaseImages(item.case_id);
            imageCount = imagesResponse.total || imagesResponse.images?.length || 0;
          } catch (e) {
            console.warn(`Failed to fetch images for case ${item.case_id}:`, e);
            imageCount = 0;
          }
          
          dynamicHtml += `
            <div onclick="viewCaseDetails('${item.case_id}')" class="bg-white rounded-xl border border-slate-200/60 p-4 shadow-sm flex items-center justify-between group hover:border-slate-300 hover:shadow-md cursor-pointer transition-all">
              <div class="grid grid-cols-4 gap-4 md:gap-12 flex-1">
                <div>
                  <span class="block text-[9px] font-bold text-slate-400 uppercase tracking-wider">Case ID</span>
                  <span class="text-xs font-black text-slate-800">${item.case_id || 'N/A'}</span>
                </div>
                <div>
                  <span class="block text-[9px] font-bold text-slate-400 uppercase tracking-wider">Date</span>
                  <span class="text-xs font-semibold text-slate-500">${item.case_date || 'N/A'}</span>
                </div>
                <div>
                  <span class="block text-[9px] font-bold text-slate-400 uppercase tracking-wider">Top Prediction</span>
                  <span class="text-xs font-black text-slate-800 block truncate">${prediction}</span>
                </div>
                <div>
                  <span class="block text-[9px] font-bold text-slate-400 uppercase tracking-wider">Images</span>
                  <span class="text-xs font-black text-slate-800">${imageCount}</span>
                </div>
              </div>
              <div class="flex items-center space-x-3">
                <span class="px-3 py-1 text-[10px] font-bold rounded-full ${badgeColor}">${confidenceText}</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:text-slate-600 group-hover:translate-x-0.5 transition-all"></i>
              </div>
            </div>
          `;
        }
        
        container.innerHTML = dynamicHtml;
        lucide.createIcons();
        
      } catch (error) {
        container.innerHTML = `<p class="text-xs font-medium text-red-500 py-8 text-center">Error: ${error.message}</p>`;
        countBadge.innerText = 'Error';
      }
    }
  </script>
</body>
</html>
